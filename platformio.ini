; PlatformIO Project Configuration File for Track Rat ESP32-S3
; Hardware: ESP32-S3 N16R8 with built-in 2.8" TFT display and SD card
;
; Board: ESP32-S3-DevKitC-1 or similar with 16MB Flash, 8MB PSRAM
; Display: ST7789 240x320 TFT (built-in)
; GPS: Beitian BE-252Q
; Storage: SD card + LittleFS

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags for ESP32-S3 with PSRAM
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DESP32_S3
    -DUSE_TFT_DISPLAY=1
    -DUSE_SD_CARD=1

; Library dependencies
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    bodmer/TFT_eSPI@^2.5.31
    mikalhart/TinyGPSPlus@^1.0.3

; Filesystem - using both SD card and LittleFS
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv

; Upload settings
upload_speed = 921600
upload_port = /dev/ttyACM0

; Debug settings
debug_tool = esp-builtin
debug_init_break = tbreak setup
