; Track Rat - GPS lap timer
; Board: LCDWiki ES3C28P (ESP32-S3 N16R8, 2.8" ILI9341V IPS + FT6336G touch, SDIO SD slot)
; GPS:   Beitian BE-252Q
;
;   pio run -e es3c28p -t upload        flash the lap timer
;   pio run -e es3c28p -t uploadfs      copy data/ (tracks.json, Wi-Fi page) into internal flash
;   pio device monitor                  serial log (115200)

[platformio]
default_envs = es3c28p

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; Native USB on this board drops out mid-flash at high speed; 115200 is reliable
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.6
    mikalhart/TinyGPSPlus@1.1.0
    h2zero/NimBLE-Arduino@1.4.3
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1

; gzips web/ into data/web and stamps the version (see the file)
; and sets the app's project_name to "trackrat" (what the firmware upload checks)
extra_scripts =
    pre:tools/build_web.py
    post:tools/set_app_name.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1       ; serial log over the USB-C port
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0 ; Wi-Fi page's web server: core 0, beside Wi-Fi, away from the GPS loop
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4 ; Bluetooth: the phone, the OBD adapter (6.1), the camera (6.2), one spare
    ; --- TFT_eSPI configuration for the ES3C28P display ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1                      ; LCD reset is tied to the ESP32 EN pin
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:es3c28p]
