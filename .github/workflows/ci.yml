name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # For test_overlay's Pillow (the runner's own Python refuses pip installs)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Same commands as the README's Tests section, one step per test.
      # GitHub runs each step with bash -e, so any failing test fails the job.
      - name: test_laptimer
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_laptimer.cpp src/LapTimer.cpp -o /tmp/lt && /tmp/lt
      - name: test_racebox
        run: g++ -std=c++17 -Iinclude test/test_racebox.cpp src/RaceBoxPacket.cpp -o /tmp/rb && /tmp/rb
      - name: test_localtime
        run: g++ -std=c++17 -Iinclude test/test_localtime.cpp -o /tmp/ltz && /tmp/ltz
      - name: test_settings
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_settings.cpp src/LapTimer.cpp -o /tmp/st && /tmp/st
      - name: test_autostart
        run: g++ -std=c++17 -Iinclude test/test_autostart.cpp -o /tmp/as && /tmp/as
      - name: test_portal
        run: g++ -std=c++17 -Iinclude test/test_portal.cpp -o /tmp/wp && /tmp/wp
      - name: test_web
        run: node test/test_web.js
      - name: test_freeroam
        run: g++ -std=c++17 -Iinclude test/test_freeroam.cpp -o /tmp/fr && /tmp/fr
      - name: test_ubx
        run: g++ -std=c++17 -Iinclude test/test_ubx.cpp src/UbxParser.cpp -o /tmp/ubx && /tmp/ubx
      - name: test_gps_source
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_gps_source.cpp src/GpsSource.cpp src/UbxParser.cpp src/LapTimer.cpp -o /tmp/gs && /tmp/gs
      - name: test_vbo
        run: g++ -std=c++17 -pthread -DDEBUG_MODE=0 -Iinclude test/test_vbo.cpp src/VboFormat.cpp src/SessionReplay.cpp src/LapTimer.cpp -o /tmp/vbo && /tmp/vbo
      - name: test_power
        run: g++ -std=c++17 -Iinclude test/test_power.cpp -o /tmp/pw && /tmp/pw
      - name: test_deltaleds
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_deltaleds.cpp src/DeltaLeds.cpp src/LapTimer.cpp -o /tmp/dl && /tmp/dl
      - name: test_perfrun
        run: g++ -std=c++17 -Iinclude test/test_perfrun.cpp -o /tmp/pr && /tmp/pr
      - name: test_jsontext
        run: g++ -std=c++17 -Iinclude test/test_jsontext.cpp -o /tmp/jt && /tmp/jt
      - name: test_trackorder
        run: g++ -std=c++17 -Iinclude test/test_trackorder.cpp -o /tmp/to && /tmp/to
      - name: test_bestlap
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_bestlap.cpp src/LapTimer.cpp -o /tmp/bl && /tmp/bl
      - name: test_debrief
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_debrief.cpp src/LapTimer.cpp -o /tmp/db && /tmp/db
      - name: test_sectors
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_sectors.cpp src/LapTimer.cpp src/VboFormat.cpp -o /tmp/sec && /tmp/sec
      - name: test_timing
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_timing.cpp src/LapTimer.cpp -o /tmp/tm && /tmp/tm
      - name: test_situation
        run: g++ -std=c++17 -Iinclude test/test_situation.cpp -o /tmp/sit && /tmp/sit
      - name: test_retime
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_retime.cpp src/VboFormat.cpp src/SessionReplay.cpp src/LapTimer.cpp -o /tmp/rt && /tmp/rt
      - name: test_sessions
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_sessions.cpp src/LapTimer.cpp src/VboFormat.cpp src/SessionReplay.cpp -o /tmp/ses && /tmp/ses
      - name: test_logbook
        run: g++ -std=c++17 -Iinclude test/test_logbook.cpp -o /tmp/lb && /tmp/lb
      - name: test_tracklearn
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_tracklearn.cpp src/LapTimer.cpp -o /tmp/tl && /tmp/tl
      - name: test_stage
        run: g++ -std=c++17 -DDEBUG_MODE=0 -Iinclude test/test_stage.cpp src/LapTimer.cpp src/VboFormat.cpp src/SessionReplay.cpp -o /tmp/stg && /tmp/stg
      - name: test_fetch_tracks
        run: python3 test/test_fetch_tracks.py
      - name: test_overlay
        run: python -m pip install -r tools/requirements-overlay.txt && python test/test_overlay.py
      - name: test_imu
        run: g++ -std=c++17 -Iinclude test/test_imu.cpp -o /tmp/imu && /tmp/imu
      - name: test_obd
        run: g++ -std=c++17 -Iinclude test/test_obd.cpp -o /tmp/obd && /tmp/obd
      - name: test_dji
        run: g++ -std=c++17 -Iinclude test/test_dji.cpp -o /tmp/dji && /tmp/dji
      - name: test_racechrono
        run: g++ -std=c++17 -Iinclude test/test_racechrono.cpp -o /tmp/rc && /tmp/rc
      - name: test_elm327
        run: g++ -std=c++17 -Iinclude test/test_elm327.cpp -o /tmp/elm && /tmp/elm
      - name: test_tempalert
        run: g++ -std=c++17 -Iinclude test/test_tempalert.cpp -o /tmp/ta && /tmp/ta
      - name: test_devicelink
        run: g++ -std=c++17 -Iinclude test/test_devicelink.cpp -o /tmp/dl && /tmp/dl

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      # Full history so tools/build_web.py can stamp the version from `git describe`
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platformio.ini

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e es3c28p

      - name: Build filesystem image
        run: pio run -e es3c28p -t buildfs

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: .pio/build/es3c28p/firmware.bin
          if-no-files-found: error
